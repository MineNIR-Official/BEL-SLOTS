<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слот: Затерянный Город</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #060913 0%, #0c1424 100%);
            color: #4ade80; font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .slot-container {
            background: #1e293b; border: 4px solid #059669; border-radius: 24px; padding: 25px; width: 100%; max-width: 750px; box-shadow: 0 0 30px rgba(5, 150, 105, 0.4);
        }
        header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #334155; }
        .btn-back { background: #0f172a; border: 1px solid #059669; color: #4ade80; padding: 8px 18px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 14px; }
        .balance-box { background: #0f172a; padding: 8px 20px; border-radius: 30px; border: 1px solid #4ade80; font-weight: bold; font-size: 18px; color: #fff; }
        .machine-title { text-align: center; color: #fff; font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 10px #059669; }
        .reels-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; background: #0f172a; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        .cell-item { height: 85px; background: #1e293b; border: 2px solid #475569; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .cell-item svg { width: 65%; height: 65%; display: block; }
        .cell-item.win-glow { background: #064e3b; border-color: #4ade80; box-shadow: 0 0 20px #059669; transform: scale(1.05); }
        .control-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; gap: 12px; }
        .info-text { font-size: 12px; color: #94a3b8; min-width: 80px; }
        .info-text strong { font-size: 18px; color: #fff; display: block; }
        .spin-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 15px 35px; font-size: 22px; font-weight: bold; border-radius: 14px; cursor: pointer; flex: 1; }
        .spin-btn:disabled { background: #4b5563; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="slot-container">
        <header>
            <a href="index.html" class="btn-back">← В лобби</a>
            <div class="balance-box">Баланс: <span id="balance-val">1000</span> Монет</div>
        </header>
        <h1 class="machine-title">ДРЕВНИЕ ИДОЛЫ ГОРОДА 🗿</h1>
        <div class="reels-grid" id="main-board"></div>
        <div class="control-bar">
            <div class="info-text">СТАВКА:<strong>100</strong></div>
            <button class="spin-btn" id="spin-btn" onclick="startSpin()">КРУТИТЬ</button>
            <div class="info-text" style="text-align: right;">ВЫИГРЫШ:<strong id="win-val" style="color: #4ade80;">0</strong></div>
        </div>
    </div>

    <script>
        let wallet = parseInt(localStorage.getItem("global_player_balance")) || 1000;
        let isSpinning = false;

        const svgVase = '<svg viewBox="0 0 24 24" data-sym="🏺"><path fill="#eab308" d="M12 2a3 3 0 0 0-3 3v1.32A7 7 0 0 0 4 13v1a7 7 0 0 0 1.59 4.43l-.42.84A2 2 0 0 0 7 22h10a2 2 0 0 0 1.83-2.73l-.42-.84A7 7 0 0 0 20 14v-1a7 7 0 0 0-5-6.68V5a3 3 0 0 0-3-3Z"/></svg>';
        const svgCrown = '<svg viewBox="0 0 24 24" data-sym="👑"><polygon points="2,18 5,8 12,13 19,8 22,18" fill="#ca8a04"/><circle cx="12" cy="5" r="2" fill="#ef4444"/></svg>';
        const svgScroll = '<svg viewBox="0 0 24 24" data-sym="📜"><path fill="#fbcfe8" d="M19 3H7a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h12a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1ZM7 5h11v11H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>';
        const svgStatue = '<svg viewBox="0 0 24 24" data-sym="🗿"><path fill="#94a3b8" d="M12 2A4 4 0 0 0 8 6v4a2 2 0 0 0-2 2v6a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-6a2 2 0 0 0-2-2V6a4 4 0 0 0-4-4Z"/></svg>';
        const svgDiamond = '<svg viewBox="0 0 24 24" data-sym="💎"><polygon points="12,2 22,9 12,22 2,9" fill="#38bdf8"/></svg>';

        function syncWallet() {
            document.getElementById("balance-val").innerText = wallet;
            localStorage.setItem("global_player_balance", wallet.toString());
        }
        syncWallet();

        function getRandomEmoji() {
            let r = Math.floor(Math.random() * 5);
            if (r === 0) return svgVase;
            if (r === 1) return svgCrown;
            if (r === 2) return svgScroll;
            if (r === 3) return svgStatue;
            return svgDiamond;
        }

        function buildGrid() {
            const board = document.getElementById("main-board");
            board.innerHTML = "";
            for(let i=0; i<15; i++) {
                let cell = document.createElement("div");
                cell.className = "cell-item";
                cell.id = "s" + i;
                cell.innerHTML = getRandomEmoji();
                board.appendChild(cell);
            }
        }
        buildGrid();

        function startSpin() {
            if (isSpinning) return;
            if (wallet < 100) { alert("Недостаточно монет!"); wallet = 1000; syncWallet(); return; }
            
            wallet -= 100; syncWallet();
            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("win-val").innerText = "0";

            for (let i = 0; i < 15; i++) document.getElementById("s" + i).classList.remove("win-glow");

            let ticks = 0;
            const timer = setInterval(function() {
                for (let idx = 0; idx < 15; idx++) {
                    document.getElementById("s" + idx).innerHTML = getRandomEmoji();
                }
                ticks++;
                if (ticks > 10) {
                    clearInterval(timer);
                    checkWins();
                }
            }, 70);
        }

        function checkWins() {
            function getSym(id) {
                let svg = document.getElementById("s" + id).querySelector("svg");
                return svg ? svg.getAttribute("data-sym") : "";
            }
            let c0=getSym(0), c1=getSym(1), c2=getSym(2), c3=getSym(3), c4=getSym(4);
            let c5=getSym(5), c6=getSym(6), c7=getSym(7), c8=getSym(8), c9=getSym(9);
            let c10=getSym(10), c11=getSym(11), c12=getSym(12), c13=getSym(13), c14=getSym(14);

            let win = 0;
            if (c0===c1 && c1===c2 && c2===c3 && c3===c4) { win+=300; highlight(0,1,2,3,4); }
            if (c5===c6 && c6===c7 && c7===c8 && c8===c9) { win+=300; highlight(5,6,7,8,9); }
            if (c10===c11 && c11===c12 && c12===c13 && c13===c14) { win+=300; highlight(10,11,12,13,14); }

            if (win > 0) { wallet += win; document.getElementById("win-val").innerText = win; syncWallet(); }
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
        }

        function highlight(a,b,c,d,e) {
            document.getElementById("s"+a).classList.add("win-glow");
            document.getElementById("s"+b).classList.add("win-glow");
            document.getElementById("s"+c).classList.add("win-glow");
            document.getElementById("s"+d).classList.add("win-glow");
            document.getElementById("s"+e).classList.add("win-glow");
        }
    </script>
</body>
</html>
